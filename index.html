<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tokyo Neon Dystopia</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">Tokyo Neon Dystopia</h1>
      <p id="siteSub" class="sub">Cross-Section City Gallery</p>
    </div>

    <div class="topRight">
      <div class="controls">
        <button id="bgmToggle" class="btn" type="button" aria-pressed="false">
          BGM: OFF
        </button>

        <span id="bgmStatus" style="color:var(--muted); font-size:12px;">
          (tap to play)
        </span>
      </div>

      <div class="social-links" aria-label="Social links">
        <a
          href="https://www.youtube.com/@sakakiyoo"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube"
          class="social-link"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .6 9.4.6 9.4.6s7.4 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.7V8.3L16 12l-6.4 3.7Z"/>
          </svg>
          <span>YouTube</span>
        </a>

        <a
          href="https://www.instagram.com/sakakiyoo/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          class="social-link"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7Zm10.6 1.6a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2.2A2.8 2.8 0 1 0 12 15a2.8 2.8 0 0 0 0-5.6Z"/>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </div>

    <div class="meta" style="margin-top:10px;">
      <span id="visitLabel">Observation Log:</span>
      <span id="visitCount">000000</span>
    </div>
  </header>

  <audio id="bgm" preload="auto">
    <source src="./audio/bgm.mp3" type="audio/mpeg" />
  </audio>

  <main>
    <div id="meta" class="meta">
      <span id="metaId"></span>
      <span id="metaDate"></span>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <dialog id="modal" class="modal">
    <div class="modalHead">
      <div class="modalTitleBlock">
        <div id="mTitle" class="modalTitleWrap">
          <div class="title-en"></div>
          <div class="title-ja"></div>
        </div>
        <p id="mInfo" class="mInfo"></p>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button id="storyToggle" class="btn" type="button" aria-pressed="false">
          Story
        </button>

        <button id="mPrev" class="btn navBtn" type="button" aria-label="Previous illustration">
          ◁
        </button>

        <button id="mNext" class="btn navBtn" type="button" aria-label="Next illustration">
          ▷
        </button>

        <button id="mClose" class="btn" type="button" aria-label="Close modal">
          Close
        </button>
      </div>
    </div>

    <div class="modalBody">
      <div class="modalVisualWrap">
        <div class="modalImageArea">
          <img id="mImg" alt="" />

          <aside id="storyPanel" class="storyPanel" aria-hidden="true">
            <div class="storyPanelInner">
              <div id="storyLang" class="storyLang">
                <button id="langEn" class="btn langBtn active" type="button" aria-pressed="true">
                  EN
                </button>
                <button id="langJa" class="btn langBtn" type="button" aria-pressed="false">
                  JP
                </button>
              </div>

              <div id="mTags" class="tags"></div>

              <div class="storyBox">
                <p id="mDesc"></p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
