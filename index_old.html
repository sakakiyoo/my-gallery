<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tokyo Neon Dystopia</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">Tokyo Neon Dystopia</h1>
      <p id="siteSub" class="sub">Cross-Section City Gallery</p>
    </div>

    <div class="controls">
      <button id="bgmToggle" class="btn" type="button" aria-pressed="false">
        BGM: OFF
      </button>

      <span id="bgmStatus" style="color:var(--muted); font-size:12px;">
        (tap to play)
      </span>
    </div>

    <div class="meta" style="margin-top:10px;">
      <span id="visitLabel">Observation Log:</span>
      <span id="visitCount">000000</span>
    </div>
  </header>

  <audio id="bgm" preload="auto">
    <source src="./audio/bgm.mp3" type="audio/mpeg" />
  </audio>

  <main>
    <div id="meta" class="meta">
      <span id="metaId"></span>
      <span id="metaDate"></span>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <dialog id="modal" class="modal">
    <div class="modalHead">
      <div class="modalTitleBlock">
        <div id="mTitle" class="modalTitleWrap">
          <div class="title-en"></div>
          <div class="title-ja"></div>
        </div>
        <p id="mInfo" class="mInfo"></p>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button id="storyToggle" class="btn" type="button" aria-pressed="false">
          Story
        </button>

        <button id="mPrev" class="btn navBtn" type="button" aria-label="Previous illustration">
          ◁
        </button>

        <button id="mNext" class="btn navBtn" type="button" aria-label="Next illustration">
          ▷
        </button>

        <button id="mClose" class="btn" type="button" aria-label="Close modal">
          Close
        </button>
      </div>
    </div>

    <div class="modalBody">
      <div class="modalVisualWrap">
        <div class="modalImageArea">
          <img id="mImg" alt="" />

          <aside id="storyPanel" class="storyPanel" aria-hidden="true">
            <div class="storyPanelInner">
              <div id="storyLang" class="storyLang">
                <button id="langEn" class="btn langBtn active" type="button" aria-pressed="true">
                  EN
                </button>
                <button id="langJa" class="btn langBtn" type="button" aria-pressed="false">
                  JP
                </button>
              </div>

              <div id="mTags" class="tags"></div>

              <div class="storyBox">
                <p id="mDesc"></p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
