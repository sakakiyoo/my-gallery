<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tokyo Neon Dystopia</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
  <!-- language toggle -->
  <button id="langToggle" class="langToggle" type="button" aria-label="Switch language">
    jp
  </button>

  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">Tokyo Neon Dystopia</h1>
      <p id="siteSub" class="sub">Cross-Section City Gallery</p>
    </div>

    <div class="controls">
      <input
        id="q"
        type="search"
        placeholder="Search (title / tags)"
        autocomplete="off"
      />

      <select id="tag">
        <option id="tagAllOption" value="">Tags: All</option>
      </select>

      <label class="chip">
        <input id="onlyFav" type="checkbox" />
        <span id="onlyFavLabel">Favorites only</span>
      </label>

      <button id="bgmToggle" class="btn" type="button" aria-pressed="false">
        BGM: OFF
      </button>

      <span id="bgmStatus" style="color:var(--muted); font-size:12px;">
        (tap to play)
      </span>
    </div>

    <div class="meta" style="margin-top:10px;">
      <span id="visitLabel">Observation Log:</span>
      <span id="visitCount">000000</span>
    </div>
  </header>

  <audio id="bgm" preload="auto">
    <source src="./audio/bgm.mp3" type="audio/mpeg" />
  </audio>

  <main>
    <div id="meta" class="meta"></div>
    <div id="grid" class="grid"></div>
  </main>

  <dialog id="modal" class="modal">
    <div class="modalHead">
      <div>
        <h2 id="mTitle"></h2>
        <p id="mInfo" class="mInfo"></p>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button id="storyToggle" class="btn" type="button" aria-pressed="false">
          Story
        </button>

        <button id="mPrev" class="btn navBtn" type="button" aria-label="Previous illustration">
          ◁
        </button>

        <button id="mNext" class="btn navBtn" type="button" aria-label="Next illustration">
          ▷
        </button>

        <button id="mShare" class="btn" type="button">X</button>
        <button id="mFav" class="btn" type="button">☆</button>
        <button id="mClose" class="btn" type="button">Close</button>
      </div>
    </div>

    <div class="modalBody split storyHidden">
      <div class="leftArea">
        <img id="mImg" alt="" />
      </div>

      <div class="rightArea">
        <div id="mTags" class="tags"></div>
        <div class="storyBox">
          <p id="mDesc"></p>
        </div>
      </div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
